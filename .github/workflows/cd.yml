name: CD - Triển khai Vercel Dự phòng (Manual Fallback)

# Luồng triển khai Production chính thức do Vercel Git Integration đảm nhiệm tự động khi push/merge vào main.
# Workflow này chỉ dùng làm phương án dự phòng khi cần kích hoạt thủ công qua GitHub Actions.
on:
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    name: 🚀 Triển khai lên Vercel Production
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Cài đặt thư viện
        run: npm ci

      - name: 🔑 Kiểm tra cấu hình Vercel Token
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Đã tìm thấy đầy đủ Vercel Secrets trên GitHub."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Chưa cấu hình VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID trên GitHub Secrets."
            echo "ℹ️ Dự án sẽ tiếp tục sử dụng luồng Vercel Git Integration tự động (Khuyến nghị)."
          fi

      - name: 🌐 Cài đặt Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install --global vercel@latest

      - name: 📥 Kéo cấu hình môi trường từ Vercel
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Đóng gói Artifacts với Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Triển khai lên Production (Prebuilt)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
